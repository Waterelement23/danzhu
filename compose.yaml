services:
  danzhu:
    image: danzhu:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        VITE_BASE_PATH: ${GAME_BASE_PATH:-/danzhu/}
    restart: unless-stopped
    init: true
    expose:
      - "2567"
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: ${NGINX_NETWORK:?Set NGINX_NETWORK to the existing nginx Docker network}
